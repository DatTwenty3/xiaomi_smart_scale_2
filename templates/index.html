<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xiaomi Smart Scale - Phân tích thành phần cơ thể</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <!-- Header -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container">
                <a class="navbar-brand" href="#">
                    <i class="fas fa-weight-hanging me-2"></i>
                    Xiaomi Smart Scale
                </a>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="container mt-4">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <!-- Card chính -->
                    <div class="card shadow-lg">
                        <div class="card-header bg-primary text-white">
                            <h4 class="mb-0">
                                <i class="fas fa-user-plus me-2"></i>
                                Nhập thông tin cá nhân
                            </h4>
                        </div>
                        <div class="card-body p-4">
                            <!-- Tabs -->
                            <ul class="nav nav-tabs mb-4" id="inputTabs" role="tablist">
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link active" id="manual-tab" data-bs-toggle="tab" 
                                            data-bs-target="#manual" type="button" role="tab">
                                        <i class="fas fa-keyboard me-2"></i>Nhập thủ công
                                    </button>
                                </li>
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link" id="qr-tab" data-bs-toggle="tab" 
                                            data-bs-target="#qr" type="button" role="tab">
                                        <i class="fas fa-qrcode me-2"></i>Quét CCCD
                                    </button>
                                </li>
                            </ul>

                            <!-- Tab Content -->
                            <div class="tab-content" id="inputTabsContent">
                                <!-- Tab nhập thủ công -->
                                <div class="tab-pane fade show active" id="manual" role="tabpanel">
                                    <form id="manualForm">
                                        <div class="row">
                                            <div class="col-md-6 mb-3">
                                                <label for="manualName" class="form-label">Họ và tên *</label>
                                                <input type="text" class="form-control" id="manualName" required>
                                            </div>
                                            <div class="col-md-6 mb-3">
                                                <label for="manualDob" class="form-label">Ngày sinh (dd/mm/yyyy) *</label>
                                                <input type="text" class="form-control" id="manualDob" 
                                                       placeholder="dd/mm/yyyy" required>
                                            </div>
                                        </div>
                                        <div class="row">
                                            <div class="col-md-6 mb-3">
                                                <label for="manualGender" class="form-label">Giới tính *</label>
                                                <select class="form-select" id="manualGender" required>
                                                    <option value="">Chọn giới tính</option>
                                                    <option value="male">Nam</option>
                                                    <option value="female">Nữ</option>
                                                </select>
                                            </div>
                                            <div class="col-md-6 mb-3">
                                                <label for="manualAge" class="form-label">Tuổi *</label>
                                                <input type="number" class="form-control" id="manualAge" 
                                                       min="1" max="120" required>
                                            </div>
                                        </div>
                                        <div class="row">
                                            <div class="col-md-6 mb-3">
                                                <label for="manualHeight" class="form-label">Chiều cao (cm) *</label>
                                                <input type="number" class="form-control" id="manualHeight" 
                                                       min="100" max="250" step="0.1" required>
                                            </div>
                                            <div class="col-md-6 mb-3">
                                                <label for="manualWeight" class="form-label">Cân nặng (kg) *</label>
                                                <input type="number" class="form-control" id="manualWeight" 
                                                       min="20" max="300" step="0.1" required>
                                            </div>
                                        </div>
                                        <div class="row">
                                            <div class="col-md-6 mb-3">
                                                <label for="manualActivity" class="form-label">Hệ số hoạt động *</label>
                                                <select class="form-select" id="manualActivity" required>
                                                    <option value="1.2">Ít vận động (1.2)</option>
                                                    <option value="1.375">Vận động nhẹ (1.375)</option>
                                                    <option value="1.55">Vận động vừa (1.55)</option>
                                                    <option value="1.725">Vận động nhiều (1.725)</option>
                                                    <option value="1.9">Vận động rất nhiều (1.9)</option>
                                                </select>
                                            </div>
                                            <div class="col-md-6 mb-3">
                                                <label for="manualCccd" class="form-label">Số CCCD (tùy chọn)</label>
                                                <input type="text" class="form-control" id="manualCccd">
                                            </div>
                                        </div>
                                    </form>
                                </div>

                                <!-- Tab quét QR -->
                                <div class="tab-pane fade" id="qr" role="tabpanel">
                                    <div class="text-center mb-4">
                                        <div class="qr-scanner-container">
                                            <button type="button" class="btn btn-primary btn-lg" id="scanQrBtn">
                                                <i class="fas fa-qrcode me-2"></i>
                                                Quét mã QR CCCD
                                            </button>
                                            <div id="qrStatus" class="mt-3">
                                                <span class="badge bg-secondary">Chưa quét CCCD</span>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <!-- Thông tin từ CCCD -->
                                    <div id="cccdInfo" class="card bg-light" style="display: none;">
                                        <div class="card-header">
                                            <h6 class="mb-0"><i class="fas fa-id-card me-2"></i>Thông tin từ CCCD</h6>
                                        </div>
                                        <div class="card-body">
                                            <div class="row">
                                                <div class="col-md-6">
                                                    <p><strong>Họ tên:</strong> <span id="cccdName">-</span></p>
                                                    <p><strong>Ngày sinh:</strong> <span id="cccdDob">-</span></p>
                                                </div>
                                                <div class="col-md-6">
                                                    <p><strong>Giới tính:</strong> <span id="cccdGender">-</span></p>
                                                    <p><strong>Số CCCD:</strong> <span id="cccdId">-</span></p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Form bổ sung cho QR -->
                                    <form id="qrForm" style="display: none;">
                                        <div class="row">
                                            <div class="col-md-6 mb-3">
                                                <label for="qrHeight" class="form-label">Chiều cao (cm) *</label>
                                                <input type="number" class="form-control" id="qrHeight" 
                                                       min="100" max="250" step="0.1" required>
                                            </div>
                                            <div class="col-md-6 mb-3">
                                                <label for="qrWeight" class="form-label">Cân nặng (kg) *</label>
                                                <input type="number" class="form-control" id="qrWeight" 
                                                       min="20" max="300" step="0.1" required>
                                            </div>
                                        </div>
                                        <div class="row">
                                            <div class="col-md-6 mb-3">
                                                <label for="qrActivity" class="form-label">Hệ số hoạt động *</label>
                                                <select class="form-select" id="qrActivity" required>
                                                    <option value="1.2">Ít vận động (1.2)</option>
                                                    <option value="1.375">Vận động nhẹ (1.375)</option>
                                                    <option value="1.55">Vận động vừa (1.55)</option>
                                                    <option value="1.725">Vận động nhiều (1.725)</option>
                                                    <option value="1.9">Vận động rất nhiều (1.9)</option>
                                                </select>
                                            </div>
                                        </div>
                                    </form>
                                </div>
                            </div>

                            <!-- Buttons -->
                            <div class="d-flex justify-content-between mt-4">
                                <button type="button" class="btn btn-outline-secondary" id="clearBtn">
                                    <i class="fas fa-eraser me-2"></i>Xóa dữ liệu
                                </button>
                                <button type="button" class="btn btn-success btn-lg" id="calculateBtn">
                                    <i class="fas fa-calculator me-2"></i>Tính toán
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Loading Modal -->
                    <div class="modal fade" id="loadingModal" tabindex="-1" data-bs-backdrop="static">
                        <div class="modal-dialog modal-dialog-centered">
                            <div class="modal-content">
                                <div class="modal-body text-center py-4">
                                    <div class="spinner-border text-primary mb-3" role="status">
                                        <span class="visually-hidden">Đang tải...</span>
                                    </div>
                                    <h5>Đang tính toán...</h5>
                                    <p class="text-muted">Vui lòng chờ trong giây lát</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Results Modal -->
                    <div class="modal fade" id="resultsModal" tabindex="-1">
                        <div class="modal-dialog modal-xl">
                            <div class="modal-content">
                                <div class="modal-header bg-success text-white">
                                    <h5 class="modal-title">
                                        <i class="fas fa-chart-line me-2"></i>Kết quả phân tích
                                    </h5>
                                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                                </div>
                                <div class="modal-body" id="resultsContent">
                                    <!-- Kết quả sẽ được hiển thị ở đây -->
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                                    <button type="button" class="btn btn-primary" id="viewDetailedResults">
                                        <i class="fas fa-external-link-alt me-2"></i>Xem chi tiết
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>

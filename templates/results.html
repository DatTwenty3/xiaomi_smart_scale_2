<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kết quả phân tích - Hệ thống chăm sóc sức khoẻ điện tử</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <!-- Main Content -->
        <div class="container mt-4">
            <!-- Main Title -->
            <div class="row justify-content-center mb-5">
                <div class="col-12 text-center">
                    <div class="logo-container mb-4 fade-in">
                        <img src="{{ url_for('static', filename='logo.png') }}" alt="HCMUT Logo" class="logo-img">
                    </div>
                    <h1 class="display-4 fw-bold text-primary mb-5 fade-in" style="animation-delay: 0.1s;">
                        🏥 Hệ thống chăm sóc sức khoẻ điện tử 💊
                    </h1>
                    <p class="lead text-muted fade-in" style="animation-delay: 0.2s;">Kết quả phân tích thành phần cơ thể</p>
                    <a href="/" class="btn btn-outline-primary mt-3 fade-in" style="animation-delay: 0.4s;">
                        <i class="fas fa-home me-1"></i>Trang chủ
                    </a>
                </div>
            </div>
            <div class="row">
                <div class="col-12">
                    <div class="card shadow-lg scale-in" style="animation-delay: 0.6s;">
                        <div class="card-header bg-success text-white">
                            <h4 class="mb-0">
                                <i class="fas fa-chart-line me-2"></i>
                                Kết quả phân tích thành phần cơ thể
                            </h4>
                        </div>
                        <div class="card-body p-4">
                            <!-- Thông tin người dùng -->
                            <div class="row mb-4">
                                <div class="col-12">
                                    <h5 class="text-primary mb-3">
                                        <i class="fas fa-user me-2"></i>Thông tin cá nhân
                                    </h5>
                                    <div class="card bg-light">
                                        <div class="card-body">
                                            <div class="row" id="userInfo">
                                                <!-- Thông tin sẽ được điền bằng JavaScript -->
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Các chỉ số cơ bản -->
                            <div class="row mb-4">
                                <div class="col-12">
                                    <h5 class="text-primary mb-3">
                                        <i class="fas fa-chart-bar me-2"></i>Chỉ số cơ bản
                                    </h5>
                                    <div class="row" id="basicMetrics">
                                        <!-- Các chỉ số sẽ được điền bằng JavaScript -->
                                    </div>
                                </div>
                            </div>

                            <!-- Thành phần cơ thể -->
                            <div class="row mb-4">
                                <div class="col-12">
                                    <h5 class="text-primary mb-3">
                                        <i class="fas fa-dumbbell me-2"></i>Thành phần cơ thể
                                    </h5>
                                    <div class="row" id="bodyComposition">
                                        <!-- Thành phần cơ thể sẽ được điền bằng JavaScript -->
                                    </div>
                                </div>
                            </div>

                            <!-- Khuyến nghị AI -->
                            <div class="row mb-4">
                                <div class="col-12">
                                    <h5 class="text-primary mb-3">
                                        <i class="fas fa-robot me-2"></i>Khuyến nghị AI
                                    </h5>
                                    <div class="card bg-light">
                                        <div class="card-body">
                                            <div id="aiRecommendations">
                                                <!-- Khuyến nghị AI sẽ được điền bằng JavaScript -->
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Biểu đồ (nếu cần) -->
                            <div class="row mb-4">
                                <div class="col-12">
                                    <h5 class="text-primary mb-3">
                                        <i class="fas fa-chart-pie me-2"></i>Biểu đồ phân tích
                                    </h5>
                                    <div class="card">
                                        <div class="card-body">
                                            <canvas id="bodyCompositionChart" width="400" height="200"></canvas>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Actions -->
                            <div class="row">
                                <div class="col-12 text-center">
                                    <button type="button" class="btn btn-primary btn-lg me-3" onclick="window.print()">
                                        <i class="fas fa-print me-2"></i>In kết quả
                                    </button>
                                    <a href="/" class="btn btn-outline-primary btn-lg">
                                        <i class="fas fa-redo me-2"></i>Phân tích mới
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{{ url_for('static', filename='results.js') }}"></script>
</body>
</html>
